name: streamix

x-api-base-url: &api-base-url "http://${PUBLIC_HOST:-localhost}:${API_PORT:-8080}/api/v1"

x-backend-environment: &backend-environment
  APP_ENV: development
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: ${DB_USER:-streamix}
  DB_PASSWORD: ${DB_PASSWORD:-streamix}
  DB_NAME: ${DB_NAME:-streamix}
  DB_SSLMODE: disable
  JWT_SECRET: ${JWT_SECRET:-streamix-development-secret-change-me}
  PLAYBACK_TOKEN_TTL: ${PLAYBACK_TOKEN_TTL:-1h}
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_DB: "0"
  QUEUE_STREAM: video-transcode
  QUEUE_GROUP: transcode-workers
  QUEUE_CLAIM_IDLE: 3s
  STORAGE_DRIVER: local
  LOCAL_STORAGE_ROOT: /data/storage

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-streamix}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-streamix}
      POSTGRES_DB: ${DB_NAME:-streamix}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: api
    restart: unless-stopped
    environment:
      <<: *backend-environment
      HTTP_PORT: "8080"
      CORS_ALLOWED_ORIGINS: "http://${PUBLIC_HOST:-localhost}:${WEB_PORT:-3000}"
    volumes:
      - storage_data:/data/storage
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      <<: *backend-environment
    volumes:
      - storage_data:/data/storage
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: *api-base-url
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
  storage_data:
